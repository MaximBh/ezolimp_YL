<!DOCTYPE html>
<html>
<head>
    <title>Тест регистрации</title>
</head>
<body>
    <h1>Тест регистрации пользователя</h1>
    
    <form id="registerForm">
        <div>
            <label>Имя пользователя:</label><br>
            <input type="text" id="username" placeholder="Минимум 3 символа">
        </div><br>
        
        <div>
            <label>Email:</label><br>
            <input type="email" id="email" placeholder="example@mail.com">
        </div><br>
        
        <div>
            <label>Пароль:</label><br>
            <input type="password" id="password" placeholder="Минимум 6 символов">
        </div><br>
        
        <div>
            <label>Полное имя:</label><br>
            <input type="text" id="full_name" placeholder="Иван Иванов">
        </div><br>
        
        <div>
            <label>Школа:</label><br>
            <input type="text" id="school" placeholder="Школа №123">
        </div><br>
        
        <div>
            <label>Класс:</label><br>
            <input type="number" id="grade" min="1" max="11" placeholder="От 1 до 11">
        </div><br>
        
        <button type="button" onclick="registerUser()">Зарегистрироваться</button>
        <button type="button" onclick="clearForm()">Очистить</button>
    </form>
    
    <div id="result"></div>

    <script>
        const API_URL = 'http://127.0.0.1:8000';
        
        function showResult(data, isError = false) {
            const result = document.getElementById('result');
            
            if (isError && data.detail && Array.isArray(data.detail)) {
                // Обрабатываем ошибки валидации
                let errors = [];
                data.detail.forEach(error => {
                    const field = error.loc[error.loc.length - 1]; // поле
                    const message = error.msg.replace('Value error, ', ''); // сообщение
                    errors.push(`${field}: ${message}`);
                });
                result.innerHTML = `<h3>Ошибки валидации:</h3><ul><li>${errors.join('</li><li>')}</li></ul>`;
                result.style.color = 'red';
            } else if (isError) {
                // Обычная ошибка
                result.innerHTML = `<h3>Ошибка:</h3><p>${data.detail || data.error || JSON.stringify(data)}</p>`;
                result.style.color = 'red';
            } else {
                // Успех
                result.innerHTML = `<h3>Успех!</h3><p>${data.message}</p>`;
                result.style.color = 'green';
            }
        }

        async function registerUser() {
            const userData = {
                username: document.getElementById('username').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                full_name: document.getElementById('full_name').value,
                school: document.getElementById('school').value,
                grade: parseInt(document.getElementById('grade').value)
            };

            try {
                const response = await fetch(`${API_URL}/auth/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(userData)
                });

                const data = await response.json();
                
                if (response.ok) {
                    showResult(data, false);
                } else {
                    showResult(data, true);
                }
            } catch (error) {
                showResult({error: error.message}, true);
            }
        }

        function clearForm() {
            document.getElementById('registerForm').reset();
            document.getElementById('result').innerHTML = '';
        }
    </script>
</body>
</html>
