<!DOCTYPE html>
<html>
<head>
    <title>Тест API</title>
</head>
<body>
    <h1>Тестирование API</h1>
    
    <button onclick="checkHealth()">Проверить сервер</button>
    <button onclick="getStats()">Статистика</button>
    <button onclick="createTestData()">Создать данные</button>
    <button onclick="getUsers()">Показать пользователей</button>
    <button onclick="getTasks()">Показать задачи</button>
    <button onclick="clearResults()">Очистить</button>
    
    <div id="results"></div>

    <script>
        const API_URL = 'http://127.0.0.1:8000';
        
        function showResult(data) {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre><hr>`;
            results.appendChild(div);
        }

        function clearResults() {
            document.getElementById('results').innerHTML = '';
        }

        async function checkHealth() {
            const response = await fetch(`${API_URL}/`);
            const data = await response.json();
            showResult(data);
        }

        async function getStats() {
            const response = await fetch(`${API_URL}/stats`);
            const data = await response.json();
            showResult(data);
        }

        async function createTestData() {
            const response = await fetch(`${API_URL}/test/create_sample_data`, {method: 'POST'});
            const data = await response.json();
            showResult(data);
        }

        async function getUsers() {
            const response = await fetch(`${API_URL}/users`);
            const data = await response.json();
            showResult(data);
        }

        async function getTasks() {
            const response = await fetch(`${API_URL}/tasks`);
            const data = await response.json();
            showResult(data);
        }
    </script>
</body>
</html>
