<!DOCTYPE html>
<html>
<head>
    <title>Тест авторизации</title>
</head>
<body>
    <h1>Тест системы авторизации</h1>
    
    <div>
        <h3>1. Войти в систему</h3>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <button onclick="login()">Войти</button>
    </div>
    
    <div>
        <h3>2. Тестировать защищенные endpoints</h3>
        <button onclick="getMe()">Мой профиль (/auth/me)</button>
        <button onclick="makeAdmin()">Сделать себя админом</button>
        <button onclick="getAdminUsers()">Админ: все пользователи</button>
        <button onclick="logout()">Выйти</button>
    </div>
    
    <div>
        <button onclick="clearResults()">Очистить результаты</button>
    </div>
    
    <div id="results"></div>

    <script>
        const API_URL = 'http://127.0.0.1:8000';
        let authToken = null;
        
        function showResult(data, title = '') {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.innerHTML = `<h4>${title}</h4><pre>${JSON.stringify(data, null, 2)}</pre><hr>`;
            results.appendChild(div);
        }

        function clearResults() {
            document.getElementById('results').innerHTML = '';
        }

        async function login() {
            const loginData = {
                username: document.getElementById('username').value,
                password: document.getElementById('password').value
            };

            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(loginData)
                });

                const data = await response.json();
                
                if (response.ok) {
                    authToken = data.token;
                    showResult(data, 'Вход выполнен');
                } else {
                    showResult(data, 'Ошибка входа');
                }
            } catch (error) {
                showResult({error: error.message}, 'Ошибка');
            }
        }

        async function getMe() {
            if (!authToken) {
                showResult({error: 'Сначала войдите в систему'}, 'Ошибка');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/auth/me`, {
                    headers: {'Authorization': authToken}
                });
                const data = await response.json();
                showResult(data, 'Мой профиль');
            } catch (error) {
                showResult({error: error.message}, 'Ошибка');
            }
        }

        async function makeAdmin() {
            if (!authToken) {
                showResult({error: 'Сначала войдите в систему'}, 'Ошибка');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/auth/make_admin`, {
                    method: 'POST',
                    headers: {'Authorization': authToken}
                });
                const data = await response.json();
                showResult(data, 'Назначение админом');
            } catch (error) {
                showResult({error: error.message}, 'Ошибка');
            }
        }

        async function getAdminUsers() {
            if (!authToken) {
                showResult({error: 'Сначала войдите в систему'}, 'Ошибка');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/admin/users`, {
                    headers: {'Authorization': authToken}
                });
                const data = await response.json();
                showResult(data, 'Админ: все пользователи');
            } catch (error) {
                showResult({error: error.message}, 'Ошибка');
            }
        }

        async function logout() {
            if (!authToken) {
                showResult({error: 'Вы не вошли в систему'}, 'Ошибка');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/auth/logout`, {
                    method: 'POST',
                    headers: {'Authorization': authToken}
                });
                const data = await response.json();
                authToken = null;
                showResult(data, 'Выход');
            } catch (error) {
                showResult({error: error.message}, 'Ошибка');
            }
        }
    </script>
</body>
</html>
