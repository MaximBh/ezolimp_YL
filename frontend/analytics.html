<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EzOlimp — Аналитика</title>
<link rel="stylesheet" href="shared.css">
<script>var d=document.documentElement;d.setAttribute("data-theme",localStorage.getItem("ez-theme")||"light");d.classList.add("no-transition");window.addEventListener("load",function(){d.classList.remove("no-transition")})</script>
<style>
.analytics-wrap { max-width:1100px; margin:0 auto; padding:96px 40px 80px; }
.stats-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:24px; }
.stat-box { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:24px; text-align:center; transition:background .3s; }
.stat-box .num { font-size:32px; font-weight:800; color:var(--accent); }
.stat-box .lbl { font-size:13px; color:var(--text3); margin-top:5px; }

.two-col { display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:20px; }
.analytics-card { background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:28px; transition:background .3s; }
.analytics-card h3 { font-size:18px; font-weight:700; margin-bottom:18px; }

.subject-row { display:flex; align-items:center; gap:12px; margin-bottom:12px; }
.subject-name { font-size:14px; font-weight:500; min-width:120px; }
.subject-bar-wrap { flex:1; height:8px; background:var(--bg2); border-radius:4px; overflow:hidden; }
.subject-bar { height:100%; background:var(--accent); border-radius:4px; transition:width .6s ease; }
.subject-count { font-size:13px; color:var(--text3); min-width:30px; text-align:right; }

.diff-row { display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--border); font-size:14px; }
.diff-row:last-child { border-bottom:none; }

.rating-history { display:flex; align-items:flex-end; gap:4px; height:80px; }
.rating-bar { flex:1; background:var(--accent-m); border-radius:4px 4px 0 0; min-height:4px; transition:height .4s ease; }
.rating-bar:hover { background:var(--accent); }

@media (max-width:800px) {
  .stats-grid { grid-template-columns:1fr 1fr; }
  .two-col { grid-template-columns:1fr; }
  .analytics-wrap { padding:84px 20px 60px; }
}
</style>
</head>
<body>
<div class="page-wrap">
<canvas id="neural-bg"></canvas>
<main>
<div class="analytics-wrap">

  <div class="page-header" style="padding:0 0 28px">
    <h1>Аналитика</h1>
    <p>Твой прогресс и статистика</p>
  </div>

  <div class="stats-grid">
    <div class="stat-box fade-up"><div class="num" id="aSolved">—</div><div class="lbl">Решено задач</div></div>
    <div class="stat-box fade-up"><div class="num" id="aCorrect">—</div><div class="lbl">Правильных</div></div>
    <div class="stat-box fade-up"><div class="num" id="aPoints">—</div><div class="lbl">Очков</div></div>
    <div class="stat-box fade-up"><div class="num" id="aRating">—</div><div class="lbl">Рейтинг Elo</div></div>
  </div>

  <div class="two-col">
    <div class="analytics-card fade-up">
      <h3>По предметам</h3>
      <div id="subjectStats"><div style="color:var(--text3);font-size:14px">Загрузка...</div></div>
    </div>
    <div class="analytics-card fade-up">
      <h3>По сложности</h3>
      <div id="diffStats"><div style="color:var(--text3);font-size:14px">Загрузка...</div></div>
    </div>
  </div>

  <div class="analytics-card fade-up">
    <h3>Динамика рейтинга</h3>
    <div class="rating-history" id="ratingHistory">
      <div style="color:var(--text3);font-size:14px;align-self:center">Загрузка...</div>
    </div>
  </div>

</div>
</main>
</div>


<script src="layout.js"></script>
<script src="shared.js"></script>
<script>
renderNav('analytics.html');
renderFooter();

const token = localStorage.getItem('token');
if (!token) { location.href='main.html'; }

const DEMO_ANALYTICS = {
  rating: 1240,
  total_solved: 42, correct_answers: 38, total_points: 380,
  by_subject: { 'математика':18, 'физика':10, 'информатика':8, 'химия':4, 'биология':2 },
  by_difficulty: { easy:20, medium:15, hard:7 },
  rating_history: [1000,1020,1010,1045,1080,1060,1100,1130,1120,1160,1200,1240]
};

async function loadAnalytics() {
  let me = null, stats = null;
  try {
    const meR = await fetch(`${API_URL}/auth/me`, { headers:{ Authorization: token } });
    if (!meR.ok) throw new Error();
    me = await meR.json();
    const statsR = await fetch(`${API_URL}/users/${me.id}/stats`, { headers:{ Authorization: token } });
    if (!statsR.ok) throw new Error();
    stats = await statsR.json();
  } catch {
    me = { rating: DEMO_ANALYTICS.rating };
    stats = { total_solved: DEMO_ANALYTICS.total_solved, correct_answers: DEMO_ANALYTICS.correct_answers, total_points: DEMO_ANALYTICS.total_points, by_subject: DEMO_ANALYTICS.by_subject, by_difficulty: DEMO_ANALYTICS.by_difficulty, rating_history: DEMO_ANALYTICS.rating_history };
  }

  document.getElementById('aRating').textContent  = me.rating||'—';
  document.getElementById('aSolved').textContent  = stats.total_solved||0;
  document.getElementById('aCorrect').textContent = stats.correct_answers||0;
  document.getElementById('aPoints').textContent  = stats.total_points||0;

  const bySubj = stats.by_subject || DEMO_ANALYTICS.by_subject;
  if (Object.keys(bySubj).length) {
    const max = Math.max(...Object.values(bySubj));
    document.getElementById('subjectStats').innerHTML = Object.entries(bySubj)
      .sort((a,b)=>b[1]-a[1]).map(([s,c])=>`
      <div class="subject-row">
        <div class="subject-name">${s}</div>
        <div class="subject-bar-wrap"><div class="subject-bar" style="width:${Math.round(c/max*100)}%"></div></div>
        <div class="subject-count">${c}</div>
      </div>`).join('');
  }

  const byDiff = stats.by_difficulty || DEMO_ANALYTICS.by_difficulty;
  const diffLabels = { easy:'Лёгкие', medium:'Средние', hard:'Сложные' };
  if (Object.keys(byDiff).length) {
    document.getElementById('diffStats').innerHTML = Object.entries(byDiff).map(([d,c])=>`
      <div class="diff-row"><span>${diffLabels[d]||d}</span><span style="font-weight:700;color:var(--accent)">${c}</span></div>`).join('');
  }

  const hist = stats.rating_history || DEMO_ANALYTICS.rating_history;
  if (hist?.length) {
    const min = Math.min(...hist), range = Math.max(...hist)-min||1;
    document.getElementById('ratingHistory').innerHTML = hist.map(v=>`
      <div class="rating-bar" style="height:${Math.round((v-min)/range*72+8)}px" title="${v}"></div>`).join('');
  }
}

loadAnalytics();
</script>
</body>
</html>
