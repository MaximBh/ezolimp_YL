<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EzOlimp — Каталог задач</title>
<link rel="stylesheet" href="shared.css">
<script>var d=document.documentElement;d.setAttribute("data-theme",localStorage.getItem("ez-theme")||"light");d.classList.add("no-transition");window.addEventListener("load",function(){d.classList.remove("no-transition")})</script>
<style>
.filters {
  background:var(--surface); border:1px solid var(--border); border-radius:16px;
  padding:24px 28px; margin-bottom:28px;
  display:flex; gap:16px; align-items:flex-end; flex-wrap:wrap;
  transition:background .3s, border-color .3s;
}
.filter-group { display:flex; flex-direction:column; gap:6px; min-width:160px; }
.filter-group label { font-size:12px; font-weight:600; color:var(--text3); letter-spacing:.5px; text-transform:uppercase; }
.filter-group select { appearance:none; background:var(--bg); border:1px solid var(--border2); border-radius:8px; padding:9px 14px; font-size:14px; font-family:inherit; color:var(--text); outline:none; cursor:pointer; transition:border-color .2s, background .3s; }
.filter-group select:focus { border-color:var(--accent); }

.grade-section { margin-bottom:32px; }
.grade-title { font-size:22px; font-weight:700; margin-bottom:6px; letter-spacing:-.3px; }
.grade-count { font-size:13px; color:var(--text3); margin-bottom:16px; }
.diff-label { font-size:11px; font-weight:700; letter-spacing:1.2px; text-transform:uppercase; color:var(--text3); margin-bottom:10px; }
.tasks-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(300px,1fr)); gap:12px; margin-bottom:20px; }

.task-item {
  background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:20px;
  cursor:pointer; transition:border-color .2s, transform .2s, background .3s;
}
.task-item:hover { border-color:var(--accent-m); transform:translateY(-2px); }
.task-item-top { display:flex; align-items:flex-start; justify-content:space-between; gap:8px; margin-bottom:8px; }
.task-item-title { font-size:15px; font-weight:600; line-height:1.4; color:var(--text); }
.task-item-body { font-size:13px; color:var(--text2); line-height:1.55; margin-bottom:12px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.task-item-footer { display:flex; align-items:center; justify-content:space-between; }
.task-item-meta { display:flex; gap:6px; }
.task-item-meta span { font-size:11px; color:var(--text3); }

.empty { text-align:center; padding:60px 20px; color:var(--text3); font-size:16px; }
</style>
</head>
<body>
<div class="page-wrap">
<canvas id="neural-bg"></canvas>
<main>

<div class="page-header">
  <h1>Каталог задач</h1>
  <p>Выбирайте задачи по предмету и классу</p>
</div>

<div style="max-width:1200px;margin:0 auto;padding:0 40px 80px">
  <div class="filters">
    <div class="filter-group">
      <label>Предмет</label>
      <select id="subjectFilter">
        <option value="">Все предметы</option>
        <option value="математика">Математика</option>
        <option value="информатика">Информатика</option>
        <option value="физика">Физика</option>
        <option value="химия">Химия</option>
        <option value="биология">Биология</option>
        <option value="английский">Английский</option>
        <option value="русский">Русский</option>
        <option value="история">История</option>
        <option value="география">География</option>
        <option value="обществознание">Обществознание</option>
        <option value="право">Право</option>
        <option value="литература">Литература</option>
        <option value="экология">Экология</option>
        <option value="робототехника">Робототехника</option>
      </select>
    </div>
    <div class="filter-group">
      <label>Класс</label>
      <select id="gradeFilter">
        <option value="">Все классы</option>
        <option value="5">5</option><option value="6">6</option><option value="7">7</option>
        <option value="8">8</option><option value="9">9</option><option value="10">10</option>
        <option value="11">11</option>
      </select>
    </div>
    <button class="btn btn-accent" id="applyFilters">Применить</button>
  </div>

  <div id="tasksList"><div class="empty">Загрузка задач...</div></div>
</div>

</main>
</div>


<script src="layout.js"></script>
<script src="shared.js"></script>
<script>
renderNav('catalog.html');
renderFooter();

const diffLabels = { easy:'Лёгкая', medium:'Средняя', hard:'Сложная', other:'—' };
const diffOrder  = ['easy','medium','hard','other'];

function escHtml(v) {
  return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

async function fetchTasksWithRetry(url) {
  const maxAttempts = 8;
  let lastError = null;
  for (let attempt = 1; attempt <= maxAttempts; attempt++) {
    try {
      const r = await fetch(url);
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      return await r.json();
    } catch (err) {
      lastError = err;
      if (attempt < maxAttempts) {
        await sleep(Math.min(2500, 300 * attempt));
      }
    }
  }
  throw lastError || new Error('Failed to load tasks');
}

function renderTask(task) {
  const diff = task.difficulty || 'other';
  const cls = { easy:'badge-easy', medium:'badge-medium', hard:'badge-hard' }[diff] || '';
  const stmt = (task.problem_statement||'').split('\n').filter(l=>!/^(source|источник)\s*:/i.test(l.trim())).join('\n').trim();
  return `<div class="task-item" onclick="location.href='training.html?task=${task.id}'">
    <div class="task-item-top">
      <div class="task-item-title">${escHtml(task.title)}</div>
      <span class="badge ${cls}">${diffLabels[diff]||diff}</span>
    </div>
    <div class="task-item-body">${escHtml(stmt)}</div>
    <div class="task-item-footer">
      <div class="task-item-meta">
        <span>${escHtml(task.subject||'')}</span>
        <span>·</span>
        <span>${task.points||10} баллов</span>
      </div>
    </div>
  </div>`;
}

async function loadTasks() {
  const subject = document.getElementById('subjectFilter').value;
  const grade   = document.getElementById('gradeFilter').value;
  const params  = new URLSearchParams();
  if (subject) params.append('subject', subject);
  if (grade)   params.append('grade', grade);
  const url = params.toString() ? `${API_URL}/tasks/filter?${params}` : `${API_URL}/tasks`;

  document.getElementById('tasksList').innerHTML = '<div class="empty">Загрузка...</div>';
  try {
    const data = await fetchTasksWithRetry(url);
    const tasks = (data.tasks||[]).filter(t => !isNaN(parseInt(t.grade)));
    if (!tasks.length) { document.getElementById('tasksList').innerHTML = '<div class="empty">Задачи не найдены</div>'; return; }

    const byGrade = {};
    tasks.forEach(t => {
      const k = String(parseInt(t.grade)||'other');
      (byGrade[k] = byGrade[k]||[]).push(t);
    });
    const grades = Object.keys(byGrade).sort((a,b) => a==='other'?1:b==='other'?-1:+a-+b);

    document.getElementById('tasksList').innerHTML = grades.map(g => {
      const gtasks = byGrade[g];
      const byDiff = { easy:[], medium:[], hard:[], other:[] };
      gtasks.forEach(t => (byDiff[byDiff[t.difficulty]?t.difficulty:'other']).push(t));
      const sections = diffOrder.filter(d => byDiff[d].length).map(d =>
        `<div class="diff-label">${diffLabels[d]}</div>
         <div class="tasks-grid">${byDiff[d].map(renderTask).join('')}</div>`
      ).join('');
      return `<div class="grade-section">
        <div class="grade-title">${g==='other'?'Без класса':g+' класс'}</div>
        <div class="grade-count">${gtasks.length} задач</div>
        ${sections}
      </div>`;
    }).join('');
  } catch {
    document.getElementById('tasksList').innerHTML = '<div class="empty" style="color:var(--accent)">Ошибка загрузки задач</div>';
  }
}

document.getElementById('applyFilters').addEventListener('click', loadTasks);
loadTasks();
</script>
</body>
</html>
